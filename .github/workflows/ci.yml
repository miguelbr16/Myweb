name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npm test
      # Incluye check-copy, check-launch (informa o bloquea), astro check y astro build.
      - name: Build
        run: npm run build
      - name: Vulnerabilidades de producción
        run: npm audit --omit=dev --audit-level=high
